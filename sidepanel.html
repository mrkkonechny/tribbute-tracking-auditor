<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>opsIQ</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">

    <!-- Sticky header -->
    <header class="header">
      <div class="header-top">
        <h1 class="header-logo">opsIQ</h1>
        <span class="header-url" id="currentUrl" title="">—</span>
      </div>

      <!-- Collapsible tracking detection summary -->
      <div class="tracking-bar" id="trackingBar">
        <button class="tracking-toggle" id="trackingToggle" aria-expanded="true" aria-controls="trackingDetail">
          <span class="tracking-summary" id="trackingSummary">Scanning…</span>
          <span class="tracking-chevron" aria-hidden="true">▲</span>
        </button>
        <div class="tracking-detail" id="trackingDetail">
          <div id="trackingContent" class="tracking-content">
            <span class="tracking-placeholder">Loading tracking data…</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Tab content areas -->
    <main class="main-content">

      <section id="tab-events" class="tab-section" role="tabpanel" aria-labelledby="nav-events" tabindex="0">
        <div class="section-toolbar">
          <label for="eventFilter" class="sr-only">Filter events</label>
          <select id="eventFilter" class="filter-select">
            <option value="all">All Events</option>
            <option value="datalayer">GA4 / dataLayer</option>
            <option value="gtag">gtag()</option>
            <option value="fbq">Facebook Pixel</option>
          </select>
          <button id="clearEvents" class="toolbar-btn">Clear</button>
          <button id="copyEvents" class="toolbar-btn">Copy All</button>
        </div>
        <div id="eventsList" class="events-list" role="list" aria-label="Captured events">
          <p class="empty-state">No events captured yet.</p>
        </div>
      </section>

      <section id="tab-audit" class="tab-section hidden" role="tabpanel" aria-labelledby="nav-audit" tabindex="-1">
        <div class="section-toolbar">
          <span class="audit-count" id="auditCount">0 issues</span>
          <button id="copyAudit" class="toolbar-btn">Copy Audit</button>
        </div>
        <div id="auditList" class="audit-list" role="list" aria-label="Audit issues">
          <p class="empty-state">No issues found.</p>
        </div>
      </section>

      <section id="tab-schema" class="tab-section hidden" role="tabpanel" aria-labelledby="nav-schema" tabindex="-1">
        <div class="section-toolbar">
          <button id="copySchema" class="toolbar-btn">Copy Schema</button>
        </div>
        <div class="schema-stacked">
          <div class="schema-sub-section">
            <h2 class="sub-section-title">Schema Validation</h2>
            <div id="schemaList" class="schema-list" role="list" aria-label="Schema items">
              <p class="empty-state">No schema detected.</p>
            </div>
          </div>
          <div class="schema-sub-section">
            <h2 class="sub-section-title">Implementation Opportunities</h2>
            <div id="opportunitiesList" class="opportunities-list" role="list" aria-label="Schema opportunities">
              <p class="empty-state">No recommendations.</p>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Fixed bottom navigation -->
    <div class="bottom-nav" role="tablist" aria-label="opsIQ sections">
      <button class="nav-btn active" id="nav-events" role="tab" data-tab="events"
              aria-selected="true" aria-controls="tab-events" tabindex="0">
        <span class="nav-icon" aria-hidden="true">📡</span>
        <span class="nav-label">Events</span>
      </button>
      <button class="nav-btn" id="nav-audit" role="tab" data-tab="audit"
              aria-selected="false" aria-controls="tab-audit" tabindex="-1">
        <span class="nav-icon" aria-hidden="true">✓</span>
        <span class="nav-label">Audit</span>
        <span class="nav-badge hidden" id="auditBadge" aria-hidden="true">0</span>
      </button>
      <button class="nav-btn" id="nav-schema" role="tab" data-tab="schema"
              aria-selected="false" aria-controls="tab-schema" tabindex="-1">
        <span class="nav-icon" aria-hidden="true">🏷</span>
        <span class="nav-label">Schema</span>
      </button>
    </div>

  </div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
